name: RC1 gates

on:
  push:
    branches: [main, master, "rc*", "release*"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend
        working-directory: desktop-app
        run: npm ci || npm install
      - name: Frontend tests + typecheck
        working-directory: desktop-app
        run: |
          npx tsc -b --pretty false
          npm test
      - name: Install backend
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Backend contract tests
        working-directory: backend
        run: python -m pytest tests/test_api_contract.py -q

  smoke:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8002 > /tmp/sw-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8002/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8002/health
      - name: RC1 smoke
        run: node scripts/smoke-rc1.mjs http://127.0.0.1:8002
      - name: RC1 load/race
        run: node scripts/load-race.mjs http://127.0.0.1:8002 4

  # Placeholder matrix — full Playwright browsers can be enabled when e2e suite lands.
  browser-checklist:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - run: |
          echo "RC1 real-browser matrix (manual / beta lab):"
          echo "Chrome, Edge, Firefox, Safari — desktop + ~390px"
          echo "Checklist: docs/RC1.md"
