# Render Blueprint — API only (pair with Vercel frontend)
# Dashboard: New → Blueprint → connect this repo
services:
  - type: web
    name: smartwrite-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LANGUAGETOOL_API_URL
        value: https://api.languagetool.org/v2/check
      - key: LLM_PROVIDER
        value: ""
      - key: DATABASE_PATH
        value: /tmp/app.db
      - key: CORS_ORIGINS
        value: https://grammarly-app.vercel.app,http://localhost:5173,http://127.0.0.1:5173
